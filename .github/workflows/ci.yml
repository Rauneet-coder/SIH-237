name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Test Suite (Node.js & MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit & Integration Tests (23 tests)
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/sih237_ci
          JWT_SECRET: ci_secret_testing_key_32_chars_long!!
        run: npm test
