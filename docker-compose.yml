version: '3.8'

networks:
  sih-net:
    driver: bridge

volumes:
  mongodb-data:
  ipfs-data:
  couchdb0-data:
  couchdb1-data:

services:

  # ──────────────────────────────────────────────────────
  # MongoDB — Application metadata database
  # Simple JSON documents, no schema, no migrations needed
  # ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sih_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: sih
      MONGO_INITDB_ROOT_PASSWORD: sih_secret
      MONGO_INITDB_DATABASE: sih237
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"   # exposed for MongoDB Compass (GUI) during dev
    networks: [sih-net]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────
  # IPFS — Private node for encrypted document storage
  # ──────────────────────────────────────────────────────
  ipfs:
    image: ipfs/kubo:v0.28.0
    container_name: sih_ipfs
    restart: unless-stopped
    volumes:
      - ipfs-data:/data/ipfs
    ports:
      - "5001:5001"   # API port
      - "8080:8080"   # Gateway port
    networks: [sih-net]
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────
  # CouchDB 0 — Fabric peer0 state database
  # ──────────────────────────────────────────────────────
  couchdb0:
    image: couchdb:3.3.3
    container_name: sih_couchdb0
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    volumes:
      - couchdb0-data:/opt/couchdb/data
    ports:
      - "5984:5984"
    networks:
      sih-net:
        aliases: [couchdb0]

  # ──────────────────────────────────────────────────────
  # CouchDB 1 — Fabric peer1 state database
  # ──────────────────────────────────────────────────────
  couchdb1:
    image: couchdb:3.3.3
    container_name: sih_couchdb1
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    volumes:
      - couchdb1-data:/opt/couchdb/data
    ports:
      - "6984:5984"
    networks:
      sih-net:
        aliases: [couchdb1]

  # ──────────────────────────────────────────────────────
  # Hyperledger Fabric Orderer (RAFT single-node for dev)
  # ──────────────────────────────────────────────────────
  orderer:
    image: hyperledger/fabric-orderer:2.5
    container_name: sih_orderer
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
      ORDERER_GENERAL_BOOTSTRAPFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
    volumes:
      - ./blockchain/network/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./blockchain/network/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./blockchain/network/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
    ports:
      - "7050:7050"
      - "7053:7053"   # admin
    networks:
      sih-net:
        aliases: [orderer.example.com]
    depends_on: [couchdb0, couchdb1]

  # ──────────────────────────────────────────────────────
  # Fabric Peer 0
  # ──────────────────────────────────────────────────────
  peer0:
    image: hyperledger/fabric-peer:2.5
    container_name: sih_peer0
    restart: unless-stopped
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: sih_237_sih-net
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer1.org1.example.com:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb0:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/network/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ./blockchain/network/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - "7051:7051"
      - "7052:7052"
    networks:
      sih-net:
        aliases: [peer0.org1.example.com]
    depends_on: [orderer, couchdb0]

  # ──────────────────────────────────────────────────────
  # Fabric Peer 1
  # ──────────────────────────────────────────────────────
  peer1:
    image: hyperledger/fabric-peer:2.5
    container_name: sih_peer1
    restart: unless-stopped
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: sih_237_sih-net
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_GOSSIP_USELEADERELECTION: "true"
      CORE_PEER_GOSSIP_ORGLEADER: "false"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer1.org1.example.com
      CORE_PEER_ADDRESS: peer1.org1.example.com:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer1.org1.example.com:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer1.org1.example.com:8051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb1:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/network/crypto-config/peerOrganizations/org1.example.com/peers/peer1.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ./blockchain/network/crypto-config/peerOrganizations/org1.example.com/peers/peer1.org1.example.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - "8051:8051"
      - "8052:8052"
    networks:
      sih-net:
        aliases: [peer1.org1.example.com]
    depends_on: [orderer, couchdb1]

  # ──────────────────────────────────────────────────────
  # Node.js Express Backend
  # ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: [sih-net]
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────────────
  # Next.js Frontend
  # ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # preserve node_modules from image
      - /app/.next           # preserve .next build cache
    networks: [sih-net]
    depends_on:
      backend:
        condition: service_healthy
